[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reviewbench"
version = "0.1.0"
description = "An evaluation harness for AI code reviewers: seeded-bug PRs, deterministic and LLM-as-judge scoring, and a CI regression gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kyle Saunders" }]
keywords = ["llm", "evaluation", "code-review", "llm-as-judge", "anthropic", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=1.13,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
reviewbench = "reviewbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
